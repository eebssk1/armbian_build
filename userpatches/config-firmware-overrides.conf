#!/usr/bin/env bash

# Load with ./compile.sh firmware-overrides [other build parameters].
# Install the wrapper at the late user_config hook, not while sourcing this
# config. This preserves the old override timing without relying on lib.config.
function user_config__firmware_overrides() {
	# Do not save our own wrapper as the original if the hook runs again.
	if declare -f firmware_overrides_original_dpkg_deb_build > /dev/null; then
		return 0
	fi

	if ! declare -f dpkg_deb_build > /dev/null; then
		exit_with_error "dpkg_deb_build not found; cannot install firmware overrides"
	fi

	# There is no pre-packaging firmware hook; preserve and delegate to the
	# framework's package builder so metadata and checksums include our files.
	eval "$(declare -f dpkg_deb_build | sed '1s/dpkg_deb_build/firmware_overrides_original_dpkg_deb_build/')"

	dpkg_deb_build() {
		local staging_dir="${1:-}"
		local firmware_override_dir="${USERPATCHES_PATH:-${SRC}/userpatches}"

		# If staging_dir is missing, let the original function report the error.
		[[ -z "$staging_dir" ]] && { firmware_overrides_original_dpkg_deb_build "$@"; return; }

		# Only modify armbian-firmware variants.
		if [[ "${artifact_name}" == "armbian-firmware"* ]]; then
			display_alert "Surgical Patch" "Injecting 30dBm regulatory fix into ${artifact_name}" "info"

			# Precedence: /lib/firmware/updates overrides everything else.
			local target_path="${staging_dir}/lib/firmware/updates"
			mkdir -p "${target_path}"

			if [[ -f "${firmware_override_dir}/regulatory.db" ]]; then
				cp "${firmware_override_dir}/regulatory.db" "${target_path}/"
				[[ -f "${firmware_override_dir}/regulatory.db.p7s" ]] && cp "${firmware_override_dir}/regulatory.db.p7s" "${target_path}/"
			else
				display_alert "Error" "Custom regulatory.db missing in ${firmware_override_dir}/" "err"
			fi

			if [[ -f "${firmware_override_dir}/brcmfmac43456-sdio.bin" ]]; then
				cp "${firmware_override_dir}/brcmfmac43456-sdio.bin" "${target_path}/../brcm/"
				[[ -f "${firmware_override_dir}/brcmfmac43456-sdio.clm_blob" ]] && cp "${firmware_override_dir}/brcmfmac43456-sdio.clm_blob" "${target_path}/../brcm/"
			else
				display_alert "Error" "Brcm firmware update missing in ${firmware_override_dir}/" "err"
			fi

			# Preserve the existing conditional WCN6855 BDF override.
			local bdf_path="${staging_dir}/lib/firmware/updates/ath11k/WCN6855/hw2.0"
			if [[ -d "${bdf_path}" && -f "${firmware_override_dir}/board-2.bin" ]]; then
				display_alert "Surgical Patch" "Bypassing hardware lock via custom BDF" "info"
				cp "${firmware_override_dir}/board-2.bin" "${bdf_path}/board-2.bin"
			fi
		fi

		# Let the original function handle md5sums and final .deb packaging.
		firmware_overrides_original_dpkg_deb_build "$@"
	}
}
