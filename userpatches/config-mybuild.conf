#!/usr/bin/env bash

source "${USERPATCHES_PATH:-${SRC}/userpatches}/config-firmware-overrides.conf"

DEST_LANG="zh_CN.UTF-8"
CONSOLE_AUTOLOGIN=yes

function user_config__mybuild() {
	TZDATA="Asia/Shanghai"
}

function pre_umount_final_image__mybuild() {
	local custom_dir="${USERPATCHES_PATH:-${SRC}/userpatches}"
	local private_dir="${custom_dir}/private/mybuild"
	local unit_dir="${MOUNT}/etc/systemd/system"
	local username

	if [[ -d "${private_dir}" ]]; then
		[[ -s "${private_dir}/first-boot.conf" && -s "${private_dir}/wifi.nmconnection" && -s "${private_dir}/root-password" ]] ||
			exit_with_error "Incomplete mybuild secrets; rerun .github/scripts/prepare-mybuild.py"

		# Native firstlogin reuses an existing regular user instead of the preset.
		username=$(sed -n 's/^PRESET_USER_NAME=//p' "${private_dir}/first-boot.conf")
		awk -F: -v name="$username" '$1 == name || ($3 >= 1000 && $3 < 65534) {exit 1}' "${MOUNT}/etc/passwd" ||
			exit_with_error "USER_NAME conflicts with an existing image account"

		install -D -m 600 "${private_dir}/first-boot.conf" "${MOUNT}/root/.not_logged_in_yet"
		install -D -m 600 "${private_dir}/wifi.nmconnection" "${MOUNT}/etc/NetworkManager/system-connections/mybuild-wifi.nmconnection"
		# Replace the default password without exposing credentials in build commands.
		chroot_mount chpasswd --encrypted < "${private_dir}/root-password"
	else
		display_alert "Using standard mode without account/Wi-Fi presets or image encryption" "Repository secrets unavailable" "wrn"
	fi

	# Partitioning recreates fstab after customize-image.sh.
	sed -i -E '\|^[[:space:]]*[^#[:space:]]+[[:space:]]+/tmp[[:space:]]|d' "${MOUNT}/etc/fstab"
	ln -sfn /dev/null "${unit_dir}/tmp.mount"
	sed -i -E '/^[[:space:]]*(ENABLED|SWAP)=/d' "${MOUNT}/etc/default/armbian-zram-config"
	printf '\nENABLED=true\nSWAP=false\n' >> "${MOUNT}/etc/default/armbian-zram-config"
	chroot_mount systemctl --no-reload enable armbian-zram-config.service
}
